# Update README badges workflow
name: Update Badges

on:
  push:
    branches:
      - main
  release:
    types: [published]
  schedule:
    # Update badges daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-badges:
    name: Update README Badges
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest release
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              return release.data.tag_name;
            } catch (error) {
              return 'v0.0.0';
            }

      - name: Get Go version
        id: go-version
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          echo "version=$GO_VERSION" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          # This is a placeholder - badges are already using shields.io dynamic URLs
          # They will update automatically based on GitHub data
          echo "Badges are using dynamic URLs and will update automatically"
          echo "Latest release: ${{ steps.release.outputs.result }}"
          echo "Go version: ${{ steps.go-version.outputs.version }}"

      - name: Verify badge URLs
        run: |
          echo "Verifying badge URLs in README.md..."
          grep -E "shields.io|goreportcard.com" README.md || echo "No badges found"
          echo "Badge verification complete"

      - name: Create badge status comment
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const output = `
            ### Badge Status Update
            
            - **Latest Release**: ${{ steps.release.outputs.result }}
            - **Go Version**: ${{ steps.go-version.outputs.version }}
            - **Status**: Badges are using dynamic URLs and update automatically
            
            All badges in README.md are configured correctly.
            `;
            
            console.log(output);

